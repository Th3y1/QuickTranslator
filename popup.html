<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: Arial, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      font-size: 14px;
      text-align: center;
      color: #89b4fa;
    }
    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #313244;
      color: #fff;
      padding: 8px;
      resize: none;
      font-size: 13px;
    }
    textarea:focus {
      outline: 1px solid #89b4fa;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background-color: #b4befe;
    }
    #status {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      color: #a6adc8;
    }
  </style>
</head>
<body>
  <h3>Tłumacz na Angielski 🚀</h3>
  <textarea id="plText" placeholder="Wpisz po polsku..."></textarea>
  <button id="translateBtn">Tłumacz i Wklej</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
